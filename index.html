<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Solution focused. Evidence based. Transparent. Everybody eats. Powerlifting coaching from Axis Training Systems." />

    <!-- ── Content-Security-Policy ──────────────────────────────────────────
      This is the ONLY real security header GitHub Pages can deliver, because a
      meta CSP is the one form the HTML parser honours. Keep it in sync with the
      duplicate in vercel.json — Vercel/Cloudflare serve it as a real header,
      which is strictly better (a header applies to every response, including
      ones that never reach the HTML parser).

      Per-origin justification:
        default-src 'self'      — everything not named below is same-origin only.
                                  frame-src/media-src/worker-src/manifest-src all
                                  fall back to this; they are not listed
                                  separately because repeating 'self' adds nothing.
        script-src  'self'      — no inline scripts exist in this file and none are
                                  injected at runtime, so no 'unsafe-inline' and no
                                  hashes are needed. Keep it that way: adding one
                                  inline <script> here silently disables XSS
                                  protection for the whole app.
        style-src   'unsafe-inline' — REQUIRED and not a weakness worth removing:
                                  the components style themselves with React
                                  `style={{…}}` attributes throughout. Inline style
                                  is not script; it cannot exfiltrate data given
                                  the connect-src below.
                    api.fontshare.com — the @font-face stylesheet in <link> below.
        font-src    cdn.fontshare.com — the .woff2 files that stylesheet points at.
        img-src     static.wixstatic.com, i.imgur.com, *.googleusercontent.com,
                    *.fbcdn.net — coach and athlete photos. This list is the
                    mirror of ALLOWED_PHOTO_HOSTS in src/data/testimonials.ts;
                    change one and you must change the other or coaches will be
                    able to save a photo URL the browser then refuses to render.
                    data:/blob: — inline SVG data URIs and object URLs.
        connect-src *.supabase.co + wss://*.supabase.co — REST, auth and realtime.
                    corsproxy.io — third-party CORS shim that src/pages/Rankings.tsx
                    routes OpenPowerlifting queries through. See the note in the
                    security report: this hands a third party every ranking query.
                    www.openpowerlifting.org — corsproxy may 302 to the origin.
        frame-src 'none'        — nothing is embedded today (Calendly is a plain
                                  target=_blank link, not an iframe). An injected
                                  iframe is a classic phishing overlay, so deny it.
                                  If a Calendly inline embed is ever added, this is
                                  the line that must change.
        object-src 'none'       — no Flash/applet/embed legacy attack surface.
        base-uri 'self'         — blocks <base href> injection retargeting every
                                  relative URL on the page.
        form-action 'self'      — blocks an injected <form> from POSTing to an
                                  attacker.
        upgrade-insecure-requests — honoured in meta; localhost is exempt so it
                                  does not affect `npm run dev`.

      NOT declared here on purpose — a meta CSP cannot deliver these, and adding
      them would be decoration that lints clean and protects nothing:
        frame-ancestors  — ignored in meta. GitHub Pages therefore CANNOT stop
                           this site being framed. Only a real response header
                           (vercel.json / Cloudflare) fixes clickjacking.
        sandbox, report-uri/report-to — likewise ignored in meta.
      For the same reason <meta http-equiv="X-Frame-Options"> and
      <meta http-equiv="X-Content-Type-Options"> were REMOVED from this file:
      browsers ignore both outside a real HTTP header, so they were advertising a
      protection that was never in effect.
    ─────────────────────────────────────────────────────────────────────────── -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://api.fontshare.com; font-src 'self' https://cdn.fontshare.com; img-src 'self' data: blob: https://static.wixstatic.com https://i.imgur.com https://*.googleusercontent.com https://*.fbcdn.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://corsproxy.io https://www.openpowerlifting.org; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />

    <!-- Honoured as a meta tag (unlike the http-equiv ones above), so it stays. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Axis Training Systems — Powerlifting Coaching</title>
    <!--
      Both preconnects are load-bearing: api.fontshare.com serves the stylesheet
      below (no crossorigin — it is not a CORS request) and cdn.fontshare.com
      serves the .woff2 files it references (crossorigin — fonts always are).

      No `integrity` on the stylesheet, deliberately. Fontshare, like Google
      Fonts, varies the CSS body by User-Agent so each browser gets the font
      format it supports; a fixed SRI hash would match one browser and hard-fail
      the rest. The Vite-bundled /assets/*.js and *.css need no SRI either —
      they are same-origin and content-hashed by the build. That leaves this one
      <link> as the only unpinned third party in the page: Fontshare can change
      what it serves at any time. The real fix is self-hosting the woff2 files
      under public/, which also lets style-src and font-src drop to 'self'.
    -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=neue-montreal@400,500,700,800,900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
