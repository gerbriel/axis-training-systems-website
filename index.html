<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Solution focused. Evidence based. Transparent. Everybody eats. Powerlifting coaching from Axis Training Systems." />

    <!-- CSP: the mirror of the header in vercel.json, and the only real security
         header GitHub Pages can deliver (a meta CSP is the one form the parser
         honours). The rationale for every origin — and why frame-ancestors and
         the http-equiv headers are absent — lives in docs/SECURITY.md, not here,
         so it is not shipped to visitors as a map of what to weaken. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://api.fontshare.com; font-src 'self' https://cdn.fontshare.com; img-src 'self' data: blob: https://*.supabase.co https://static.wixstatic.com https://i.imgur.com https://*.googleusercontent.com https://*.fbcdn.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://corsproxy.io https://www.openpowerlifting.org; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />

    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Axis Training Systems — Powerlifting Coaching</title>
    <!-- Fontshare preconnects: api serves the stylesheet (no crossorigin), cdn
         serves the woff2 (crossorigin). No SRI — Fontshare varies CSS by UA, so a
         fixed hash breaks most browsers; self-hosting under public/ is the fix. -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=neue-montreal@400,500,700,800,900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
